id = "subagents.tree"
name = "Subagent Tree"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Live delegation tree for Herdr agent panes"
platforms = ["macos", "linux"]

[[actions]]
id = "open-tree"
title = "Open delegation tree"
contexts = ["pane", "workspace"]
# Herdr spawns action/pane commands with a scrubbed environment (no user PATH).
# HERDR_BIN_PATH is injected, so route through it via /bin/sh instead of bare "herdr".
command = ["/bin/sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin subagents.tree --entrypoint tree --placement overlay --focus"]

[[panes]]
id = "tree"
title = "Delegation tree"
placement = "overlay"
command = ["/bin/sh", "-c", "PATH=\"$PATH:/opt/homebrew/bin:/usr/local/bin\" exec node index.ts"]
